[package]
name = "aionfm-ui"
description = "Rust/WASM UI shell for AionFM dashboards and operations views."
edition = "2021"
license = "DOSL-IIE-1.0"
version = "0.1.0"
authors = ["Dust LLC and Contributors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aionfm-utils = { path = "../aionfm/crates/utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
yew = { version = "0.21", features = ["csr"] }
